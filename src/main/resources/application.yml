spring:
  application:
    name: spring-ai-support-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0.1
    tools:
      throw-exception-on-error: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.supportagent: INFO
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}

support-agent:
  # 企业 Ontology 使用 Nacos Config 主动推送；Nacos 无配置/不可达时使用 classpath fallback。
  ontology:
    data-id: ${NACOS_ONTOLOGY_DATA_ID:support-agent-ontology.yaml}
    group: ${NACOS_ONTOLOGY_GROUP:DEFAULT_GROUP}
    fallback: classpath:ontology/support-agent.yaml
    timeout-ms: ${NACOS_ONTOLOGY_TIMEOUT_MS:3000}
  prompt:
    # Prompt 使用 Nacos AI Prompt API，bindings 的 key 是应用内部业务别名。
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace-id: ${NACOS_NAMESPACE_ID:public}
    bindings:
      support-system:
        key: ${NACOS_SYSTEM_PROMPT_KEY:SupportAgentService_SYSTEM_PROMPT}
        label: ${NACOS_SYSTEM_PROMPT_LABEL:production}
        required: true
      knowledge-retriever:
        key: ${NACOS_KNOWLEDGE_RETRIEVER_PROMPT_KEY:KnowledgeRetriever_SYSTEM_PROMPT}
        label: ${NACOS_KNOWLEDGE_RETRIEVER_PROMPT_LABEL:production}
        required: false
      ontology-intent-resolver:
        key: ${NACOS_ONTOLOGY_INTENT_PROMPT_KEY:OntologyIntentResolver_SYSTEM_PROMPT}
        label: ${NACOS_ONTOLOGY_INTENT_PROMPT_LABEL:production}
        required: false
