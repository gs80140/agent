spring:
  application:
    name: spring-ai-support-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0.1
    tools:
      throw-exception-on-error: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.supportagent: INFO
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}

support-agent:
  prompt:
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace-id: ${NACOS_NAMESPACE_ID:public}
    bindings:
      support-system:
        key: ${NACOS_SYSTEM_PROMPT_KEY:SupportAgentService_SYSTEM_PROMPT}
        label: ${NACOS_SYSTEM_PROMPT_LABEL:production}
        required: true
