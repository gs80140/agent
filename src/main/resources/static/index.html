<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <title>售后智能客服</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6fb;
            --panel: rgba(255, 255, 255, .92);
            --text: #172033;
            --muted: #70798b;
            --line: #e6e9f0;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --assistant: #fff;
            --user: #4f46e5;
            --shadow: 0 20px 60px rgba(35, 45, 75, .12);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, #e0e7ff 0, transparent 30%),
                radial-gradient(circle at 90% 90%, #dbeafe 0, transparent 32%),
                var(--bg);
        }

        .app {
            width: min(980px, calc(100% - 32px));
            height: min(860px, calc(100vh - 32px));
            margin: 16px auto;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 24px;
            background: var(--panel);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
        }

        .logo {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            color: #fff;
            font-size: 22px;
            background: linear-gradient(135deg, #6366f1, #2563eb);
            box-shadow: 0 8px 24px rgba(79, 70, 229, .28);
        }

        .identity { min-width: 0; }
        h1 { margin: 0; font-size: 17px; letter-spacing: .01em; }
        .status { margin-top: 3px; color: var(--muted); font-size: 12px; }
        .status::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 6px;
            border-radius: 50%;
            background: #22c55e;
        }

        .clear {
            margin-left: auto;
            border: 0;
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--muted);
            background: transparent;
            cursor: pointer;
        }
        .clear:hover { color: var(--text); background: #f1f3f8; }

        #messages {
            overflow-y: auto;
            padding: 28px clamp(18px, 5vw, 54px);
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 560px;
            margin: 6vh auto 30px;
            text-align: center;
        }
        .welcome-icon { font-size: 44px; }
        .welcome h2 { margin: 14px 0 8px; font-size: 25px; }
        .welcome p { margin: 0; line-height: 1.7; color: var(--muted); }
        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 680px;
            margin: 25px auto;
        }
        .suggestion {
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 14px;
            text-align: left;
            color: var(--text);
            background: rgba(255,255,255,.8);
            cursor: pointer;
            transition: .15s ease;
        }
        .suggestion:hover { border-color: #a5b4fc; transform: translateY(-1px); }

        .message {
            display: flex;
            gap: 10px;
            margin: 0 0 22px;
            animation: enter .2s ease-out;
        }
        @keyframes enter { from { opacity: 0; transform: translateY(5px); } }
        .message.user { justify-content: flex-end; }
        .avatar {
            flex: 0 0 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #eef2ff;
        }
        .user .avatar { display: none; }
        .bubble {
            max-width: min(720px, 82%);
            padding: 13px 16px;
            border: 1px solid var(--line);
            border-radius: 5px 17px 17px 17px;
            line-height: 1.7;
            overflow-wrap: anywhere;
            background: var(--assistant);
        }
        .user .bubble {
            color: #fff;
            border: 0;
            border-radius: 17px 17px 5px 17px;
            background: var(--user);
        }
        .bubble p { margin: 0 0 10px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble code { padding: 2px 5px; border-radius: 5px; background: #f0f2f6; }
        .bubble table { width: 100%; margin: 10px 0; border-collapse: collapse; font-size: 14px; }
        .bubble th, .bubble td { padding: 8px; border: 1px solid var(--line); text-align: left; }
        .typing span {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin: 0 2px;
            border-radius: 50%;
            background: #9ca3af;
            animation: pulse 1s infinite alternate;
        }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes pulse { to { opacity: .25; transform: translateY(-3px); } }
        .live-progress { display: grid; gap: 7px; }
        .progress-title { color: var(--primary); font-weight: 650; }
        .progress-item { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 13px; }
        .progress-item::before { content: "✓"; color: #16a34a; font-weight: 700; }
        .progress-item.active::before { content: "●"; color: #2563eb; animation: pulse 1s infinite alternate; }
        .progress-history { margin-top: 13px; padding-top: 10px; border-top: 1px dashed var(--line); }
        .progress-history summary { color: var(--primary); cursor: pointer; font-size: 12px; font-weight: 650; }
        .progress-history .live-progress { margin-top: 9px; }
        .approval-actions { display: flex; gap: 10px; margin-top: 14px; }
        .approval-actions button { border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
        .approve { color: #fff; background: #16a34a; }
        .reject { color: #991b1b; background: #fee2e2; }
        .interaction-form { display: grid; gap: 11px; margin-top: 14px; padding: 13px; border-radius: 12px; background: #f8fafc; }
        .interaction-field { display: grid; gap: 5px; }
        .interaction-field label { font-size: 12px; font-weight: 650; color: var(--text); }
        .interaction-field textarea { box-sizing: border-box; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
        .interaction-submit { justify-self: start; border: 0; border-radius: 9px; padding: 9px 16px; color: #fff; background: var(--primary); cursor: pointer; }
        .trace { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12px; }
        .trace summary { color: var(--primary); cursor: pointer; font-weight: 600; }
        .trace-meta { margin: 8px 0; color: var(--muted); }
        .trace-flow { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding: 6px 0 10px; }
        .trace-node { flex: 0 0 auto; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: #f8fafc; }
        .trace-node.completed { color: #166534; border-color: #86efac; background: #f0fdf4; }
        .trace-node.running { color: #1d4ed8; border-color: #93c5fd; background: #eff6ff; }
        .trace-node.failed { color: #991b1b; border-color: #fca5a5; background: #fef2f2; }
        .trace-node.pending { color: #64748b; }
        .trace-node.waiting { color: #92400e; border-color: #fcd34d; background: #fffbeb; }
        .trace-arrow { color: #94a3b8; }
        .trace-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
        .trace-table td { padding: 5px; border-top: 1px solid var(--line); vertical-align: top; }
        .trace-error { color: #b91c1c; }
        .mermaid-source { white-space: pre; overflow-x: auto; padding: 8px; border-radius: 8px; background: #f8fafc; }

        .composer-wrap { padding: 12px clamp(16px, 4vw, 38px) 18px; border-top: 1px solid var(--line); }
        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 9px 9px 9px 16px;
            border: 1px solid #d9ddea;
            border-radius: 17px;
            background: #fff;
            box-shadow: 0 5px 18px rgba(35, 45, 75, .06);
        }
        textarea {
            width: 100%;
            min-height: 26px;
            max-height: 130px;
            resize: none;
            border: 0;
            outline: 0;
            padding: 4px 0;
            color: var(--text);
            font: inherit;
            line-height: 1.5;
            background: transparent;
        }
        .send {
            flex: 0 0 42px;
            height: 42px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            font-size: 19px;
            background: var(--primary);
            cursor: pointer;
        }
        .send:hover { background: var(--primary-dark); }
        .send:disabled { opacity: .45; cursor: not-allowed; }
        .hint { margin: 8px 0 0; text-align: center; color: #9198a8; font-size: 11px; }

        @media (max-width: 640px) {
            .app { width: 100%; height: 100vh; margin: 0; border: 0; border-radius: 0; }
            .suggestions { grid-template-columns: 1fr; }
            #messages { padding: 22px 14px; }
            .bubble { max-width: 88%; }
            .welcome { margin-top: 3vh; }
        }
    </style>
</head>
<body>
<!-- 单页 Chat UI：不依赖前端框架，便于直接随 Spring Boot 静态资源发布。 -->
<main class="app">
    <header>
        <div class="logo">✦</div>
        <div class="identity">
            <h1>售后智能客服</h1>
            <div class="status">AI Agent 在线 · 可自动查询订单并办理售后</div>
        </div>
        <button class="clear" id="clear" type="button">清空对话</button>
    </header>

    <section id="messages" aria-live="polite">
        <div class="welcome" id="welcome">
            <div class="welcome-icon">👋</div>
            <h2>您好，需要处理什么售后问题？</h2>
            <p>请告诉我您的姓名或手机号、商品以及遇到的问题，我会查询订单、核对售后政策并协助创建工单。</p>
        </div>
        <div class="suggestions" id="suggestions">
            <button class="suggestion">我是张三，机械键盘按键连击失灵，帮我申请退货退款。</button>
            <button class="suggestion">我是张三，之前买的蓝牙耳机有杂音，可以换货吗？</button>
        </div>
    </section>

    <footer class="composer-wrap">
        <form class="composer" id="chat-form">
            <textarea id="prompt" rows="1" maxlength="4000" placeholder="输入您的问题…" aria-label="消息内容"></textarea>
            <button class="send" id="send" type="submit" aria-label="发送">➤</button>
        </form>
        <p class="hint">Enter 发送 · Shift + Enter 换行 · AI 回复仅供售后办理参考</p>
    </footer>
</main>

<script>
    // 页面只允许一个请求同时发送，避免用户重复点击创建多个 execution。
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#chat-form');
    const promptInput = document.querySelector('#prompt');
    const sendButton = document.querySelector('#send');
    let busy = false;

    const escapeHtml = value => value.replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[char]);

    function renderMarkdown(text) {
        let html = escapeHtml(text);
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');

        const lines = html.split('\n');
        let output = '';
        let inTable = false;
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.startsWith('|') && line.endsWith('|')) {
                const nextIsDivider = i + 1 < lines.length && /^\|?[\s:|-]+\|?$/.test(lines[i + 1].trim());
                const isDivider = /^\|?[\s:|-]+\|?$/.test(line);
                if (isDivider) continue;
                if (!inTable) { output += '<table>'; inTable = true; }
                const cells = line.slice(1, -1).split('|').map(cell => cell.trim());
                const tag = nextIsDivider ? 'th' : 'td';
                output += `<tr>${cells.map(cell => `<${tag}>${cell}</${tag}>`).join('')}</tr>`;
                continue;
            }
            if (inTable) { output += '</table>'; inTable = false; }
            if (line === '---') output += '<hr>';
            else if (line) output += `<p>${line}</p>`;
        }
        if (inTable) output += '</table>';
        return output;
    }

    function addMessage(role, content, typing = false) {
        document.querySelector('#welcome')?.remove();
        document.querySelector('#suggestions')?.remove();
        const item = document.createElement('article');
        item.className = `message ${role}`;
        item.innerHTML = `<div class="avatar">✦</div><div class="bubble">${
            typing ? '<div class="typing"><span></span><span></span><span></span></div>' : renderMarkdown(content)
        }</div>`;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
        return item;
    }

    async function sendMessage(text) {
        const value = text.trim();
        if (!value || busy) return;
        busy = true;
        sendButton.disabled = true;
        promptInput.value = '';
        resizeInput();
        addMessage('user', value);
        const loading = addMessage('assistant', '');
        const progress = createProgressView(loading.querySelector('.bubble'));

        try {
            const response = await fetch('/api/agent/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                body: JSON.stringify({ prompt: value })
            });
            if (!response.ok) throw new Error(await readHttpError(response, '服务请求失败'));
            let data;
            await consumeSse(response, (event, payload) => {
                if (event === 'progress') appendProgress(progress, payload);
                else if (event === 'result') data = payload.data;
                else if (event === 'error') throw new Error(payload.message || 'Agent 执行失败');
            });
            if (!data) throw new Error('SSE 连接结束，但没有收到最终结果');
            const bubble = loading.querySelector('.bubble');
            bubble.innerHTML = renderMarkdown(data.content || '未收到回复');
            attachProgressHistory(bubble, progress);
            if (data.status === 'WAITING_APPROVAL') addApprovalActions(bubble, data.executionId);
            if (data.status === 'WAITING_INPUT') addInputInteraction(bubble, data);
            await appendExecutionTrace(bubble, data.executionId);
        } catch (error) {
            const bubble = loading.querySelector('.bubble');
            bubble.innerHTML = `<p>抱歉，暂时无法处理：${escapeHtml(error.message)}</p>`;
            attachProgressHistory(bubble, progress, '查看失败前的执行过程');
        } finally {
            busy = false;
            sendButton.disabled = false;
            promptInput.focus();
            messages.scrollTop = messages.scrollHeight;
        }
    }

    function addApprovalActions(bubble, executionId) {
        // WAITING_APPROVAL 由后端 Graph 中断产生；按钮只负责提交决定，不在前端模拟流程状态。
        const actions = document.createElement('div');
        actions.className = 'approval-actions';
        actions.innerHTML = '<button class="approve" type="button">批准执行</button>'
            + '<button class="reject" type="button">拒绝</button>';
        bubble.appendChild(actions);
        actions.querySelector('.approve').addEventListener('click', () => submitDecision(bubble, executionId, true));
        actions.querySelector('.reject').addEventListener('click', () => submitDecision(bubble, executionId, false));
    }

    /** 根据后端返回的 Workflow Interaction Schema 动态生成资料表单。 */
    function addInputInteraction(bubble, data) {
        const interaction = data.interaction;
        if (!interaction) return;
        const form = document.createElement('form');
        form.className = 'interaction-form';
        Object.entries(interaction.properties || {}).forEach(([name, field]) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'interaction-field';
            const label = document.createElement('label');
            label.htmlFor = `interaction-${interaction.interactionId}-${name}`;
            label.textContent = field.label + ((interaction.required || []).includes(name) ? ' *' : '');
            const input = document.createElement('textarea');
            input.id = label.htmlFor;
            input.name = name;
            input.required = (interaction.required || []).includes(name);
            input.dataset.fieldType = field.type;
            input.maxLength = field.maxLength || 4000;
            input.placeholder = field.type === 'array' ? '每行填写一项，例如图片或视频地址' : `请输入${field.label}`;
            wrapper.append(label, input);
            form.appendChild(wrapper);
        });
        const submit = document.createElement('button');
        submit.className = 'interaction-submit';
        submit.type = 'submit';
        submit.textContent = '提交补充资料并继续';
        form.appendChild(submit);
        form.addEventListener('submit', event => {
            event.preventDefault();
            const values = {};
            form.querySelectorAll('textarea').forEach(input => {
                values[input.name] = input.dataset.fieldType === 'array'
                    ? input.value.split('\n').map(value => value.trim()).filter(Boolean)
                    : input.value.trim();
            });
            submitInteraction(form, data.executionId, interaction.interactionId, values);
        });
        bubble.appendChild(form);
    }

    async function submitInteraction(form, executionId, interactionId, values) {
        form.querySelectorAll('button, textarea').forEach(element => element.disabled = true);
        const pending = addMessage('assistant', '');
        const progress = createProgressView(pending.querySelector('.bubble'));
        try {
            const response = await fetch(`/api/agent/executions/${encodeURIComponent(executionId)}`
                + `/interactions/${encodeURIComponent(interactionId)}/stream`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                body: JSON.stringify({ values })
            });
            if (!response.ok) throw new Error(await readHttpError(response, '资料提交失败'));
            let data;
            await consumeSse(response, (event, payload) => {
                if (event === 'progress') appendProgress(progress, payload);
                else if (event === 'result') data = payload.data;
                else if (event === 'error') throw new Error(payload.message || '资料处理失败');
            });
            if (!data) throw new Error('SSE 连接结束，但没有收到资料处理结果');
            const resultBubble = pending.querySelector('.bubble');
            resultBubble.innerHTML = renderMarkdown(data.content || '资料已提交');
            attachProgressHistory(resultBubble, progress);
            if (data.status === 'WAITING_APPROVAL') addApprovalActions(resultBubble, executionId);
            if (data.status === 'WAITING_INPUT') addInputInteraction(resultBubble, data);
            await appendExecutionTrace(resultBubble, executionId);
        } catch (error) {
            const resultBubble = pending.querySelector('.bubble');
            resultBubble.innerHTML = `<p>资料提交失败：${escapeHtml(error.message)}</p>`;
            attachProgressHistory(resultBubble, progress, '查看失败前的执行过程');
            form.querySelectorAll('button, textarea').forEach(element => element.disabled = false);
        }
    }

    async function submitDecision(bubble, executionId, approved) {
        // 使用原 executionId，后端才能从对应 threadId 的 checkpoint 继续。
        bubble.querySelectorAll('button').forEach(button => button.disabled = true);
        const pending = addMessage('assistant', '');
        const progress = createProgressView(pending.querySelector('.bubble'));
        try {
            const response = await fetch(`/api/agent/executions/${encodeURIComponent(executionId)}/decision/stream`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                body: JSON.stringify({ approved })
            });
            if (!response.ok) throw new Error(await readHttpError(response, '审批请求失败'));
            let data;
            await consumeSse(response, (event, payload) => {
                if (event === 'progress') appendProgress(progress, payload);
                else if (event === 'result') data = payload.data;
                else if (event === 'error') throw new Error(payload.message || '审批执行失败');
            });
            if (!data) throw new Error('SSE 连接结束，但没有收到审批结果');
            const resultBubble = pending.querySelector('.bubble');
            resultBubble.innerHTML = renderMarkdown(data.content || '流程已结束');
            attachProgressHistory(resultBubble, progress);
            await appendExecutionTrace(resultBubble, executionId);
        } catch (error) {
            const resultBubble = pending.querySelector('.bubble');
            resultBubble.innerHTML = `<p>审批处理失败：${escapeHtml(error.message)}</p>`;
            attachProgressHistory(resultBubble, progress, '查看失败前的执行过程');
        }
    }

    function createProgressView(bubble) {
        bubble.innerHTML = '<div class="live-progress"><div class="progress-title">Agent 正在处理…</div></div>';
        return { container: bubble.querySelector('.live-progress'), active: null, events: [] };
    }

    function appendProgress(view, event) {
        view.events.push(event);
        if (view.active) view.active.classList.remove('active');
        const item = document.createElement('div');
        item.className = 'progress-item active';
        item.dataset.phase = event.phase || '';
        item.textContent = event.message || event.phase || '处理中…';
        view.container.appendChild(item);
        view.active = item;
        messages.scrollTop = messages.scrollHeight;
    }

    /** 最终回复替换实时区域后，把已收到的 SSE 事件重新挂载为可长期查看的审计记录。 */
    function attachProgressHistory(bubble, view, title = '查看本次 Agent 执行过程') {
        if (!view.events.length) return;
        const details = document.createElement('details');
        details.className = 'progress-history';
        const summary = document.createElement('summary');
        summary.textContent = `${title}（${view.events.length} 条）`;
        details.appendChild(summary);
        const list = document.createElement('div');
        list.className = 'live-progress';
        view.events.forEach(event => {
            const item = document.createElement('div');
            item.className = 'progress-item';
            item.dataset.phase = event.phase || '';
            const time = event.timestamp ? new Date(event.timestamp).toLocaleTimeString() + ' · ' : '';
            item.textContent = time + (event.message || event.phase || '处理中');
            list.appendChild(item);
        });
        details.appendChild(list);
        bubble.appendChild(details);
    }

    /** 解析 fetch 返回的 POST SSE 数据帧，兼容一个网络 chunk 中包含多个事件。 */
    async function consumeSse(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
            const { value, done } = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), { stream: !done }).replace(/\r\n/g, '\n');
            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) >= 0) {
                const frame = buffer.slice(0, boundary);
                buffer = buffer.slice(boundary + 2);
                if (!frame.trim()) continue;
                let event = 'message';
                const dataLines = [];
                frame.split('\n').forEach(line => {
                    if (line.startsWith('event:')) event = line.slice(6).trim();
                    if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
                });
                if (dataLines.length) onEvent(event, JSON.parse(dataLines.join('\n')));
            }
            if (done) break;
        }
    }

    async function readHttpError(response, fallback) {
        try {
            const body = await response.json();
            return body.detail || body.message || fallback;
        } catch (_) {
            return fallback;
        }
    }

    async function appendExecutionTrace(bubble, executionId) {
        const response = await fetch(`/api/agent/executions/${encodeURIComponent(executionId)}`);
        if (!response.ok) return;
        const trace = await response.json();
        const details = document.createElement('details');
        details.className = 'trace';
        const current = trace.currentNode ? ` · 当前：${escapeHtml(trace.currentNode)}` : '';
        details.innerHTML = `<summary>查看动态 Graph 执行轨迹</summary>
            <div class="trace-meta">状态：${escapeHtml(trace.status)}${current} · Ontology：${escapeHtml(trace.ontologyVersion)} · Workflow：${escapeHtml(trace.workflowId)}@${escapeHtml(trace.workflowVersion)} · ${trace.elapsedMs} ms</div>
            <div class="trace-meta">引用知识：${escapeHtml((trace.knowledgeReferences || []).join(', ') || '-')}</div>
            <div class="trace-meta">规划说明：${escapeHtml(trace.planningReasoning || '-')}</div>`;

        const flow = document.createElement('div');
        flow.className = 'trace-flow';
        const visibleNodes = [{ capability: 'START', status: 'COMPLETED' }, ...trace.nodes,
            { capability: 'END', status: trace.status === 'COMPLETED' ? 'COMPLETED' : 'PENDING' }];
        visibleNodes.forEach((node, index) => {
            if (index) flow.insertAdjacentHTML('beforeend', '<span class="trace-arrow">→</span>');
            let status = (node.status || 'PENDING').toLowerCase();
            if ((trace.status === 'WAITING_APPROVAL' || trace.status === 'WAITING_INPUT')
                    && node.nodeId === trace.currentNode) status = 'waiting';
            flow.insertAdjacentHTML('beforeend', `<span class="trace-node ${status}" title="${escapeHtml(node.status || '')}">${escapeHtml(node.capability)}</span>`);
        });
        details.appendChild(flow);

        const rows = trace.nodes.map(node => `<tr>
            <td>${escapeHtml(node.capability)}</td><td>${escapeHtml(node.status)}</td><td>${node.elapsedMs} ms</td>
            <td>${escapeHtml(Object.keys(node.output || {}).join(', ') || '-')}</td>
            <td class="trace-error">${escapeHtml(node.error || '')}</td></tr>`).join('');
        details.insertAdjacentHTML('beforeend', `<table class="trace-table"><tbody>${rows}</tbody></table>
            <details><summary>Mermaid 源码</summary><pre class="mermaid-source">${escapeHtml(trace.mermaid)}</pre></details>`);
        bubble.appendChild(details);
    }

    function resizeInput() {
        promptInput.style.height = 'auto';
        promptInput.style.height = `${Math.min(promptInput.scrollHeight, 130)}px`;
    }

    form.addEventListener('submit', event => {
        event.preventDefault();
        sendMessage(promptInput.value);
    });
    promptInput.addEventListener('input', resizeInput);
    promptInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });
    document.querySelectorAll('.suggestion').forEach(button =>
        button.addEventListener('click', () => sendMessage(button.textContent)));
    document.querySelector('#clear').addEventListener('click', () => window.location.reload());
</script>
</body>
</html>
